[package]
name = "apf-host"
description = "A minimal CLAP host for testing built plugins: load, render, open the editor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSProcessInfo", "NSRunLoop", "NSString", "NSGeometry", "NSObjCRuntime"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSRunningApplication", "NSGraphics", "NSScreen", "NSEvent", "NSGraphicsContext"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
