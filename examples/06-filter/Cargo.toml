[package]
name = "example-06-filter"
description = "Example 06: a state-variable filter with a smoothed cutoff"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
# staticlib: linked into every plugin format by the wrapper build; rlib: for the tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
apf.workspace = true

[dev-dependencies]
apf-test.workspace = true

# Read by `cargo xtask bundle`: how the plugin is packaged.
[package.metadata.apf]
name = "APF Example 06 Filter"
bundle-id = "dev.miha.apf.example.filter"
# Audio Unit identity. Type: aumu = instrument, aufx = effect, aumf = effect with MIDI.
au-type = "aufx"
# Four characters with at least one capital. The AUv3 gets the first three plus "3".
au-subtype = "ExFi"
au-manufacturer = "MiSm"
au-manufacturer-name = "Miha Smrekar"
