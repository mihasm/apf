[package]
name = "example-07-gui"
description = "Example 07: a web view with parameter bindings, a level meter and a resizable window"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
# staticlib: linked into every plugin format by the wrapper build; rlib: for the tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
apf.workspace = true
apf-webview.workspace = true
[dev-dependencies]
apf-test.workspace = true

# Read by `cargo xtask bundle`: how the plugin is packaged.
[package.metadata.apf]
name = "APF Example 07 GUI"
bundle-id = "dev.miha.apf.example.gui"
# Audio Unit identity. Type: aumu = instrument, aufx = effect, aumf = effect with MIDI.
au-type = "aufx"
# Four characters with at least one capital. The AUv3 gets the first three plus "3".
au-subtype = "ExGu"
au-manufacturer = "MiSm"
au-manufacturer-name = "Miha Smrekar"
