<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>APF Example 10 Synth</title>
<script src="/__apf/apf.js"></script>
<style>
  :root { --bg: #121318; --panel: #1b1d24; --line: #2a2d37; --text: #e6e7ec; --dim: #8b8fa0; --accent: #5eb3ff;
    /* apf.js styles the preset bar with these variables. */
    --apf-bg: var(--bg); --apf-panel: var(--panel); --apf-line: var(--line); --apf-text: var(--text);
    --apf-dim: var(--dim); --apf-accent: var(--accent); --apf-accent-dim: #2b5d87; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; overflow: hidden; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 16px 20px; }
  .bar { grid-column: 1 / -1; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  h2 { margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .row { display: grid; grid-template-columns: 74px minmax(0, 1fr) 58px 34px; align-items: center; gap: 8px; margin: 3px 0; }
  label { color: var(--dim); }
  output { text-align: right; font-variant-numeric: tabular-nums; }
  /* Shows the controller a right-click "MIDI learn" assigned, e.g. "CC 21". */
  small { color: var(--accent); font-size: 11px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row select { grid-column: 2 / 4; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font: inherit; }
</style>
</head>
<body>
<main>
  <!-- The preset bar: list, previous/next, save, delete. apf.js builds it. -->
  <div class="bar" data-apf-presets></div>
  <section>
    <h2>Oscillator</h2>
    <!-- A select bound to a choice parameter: apf.js fills in the options. -->
    <div class="row"><label data-param-name="wave"></label><select data-param="wave"></select><small data-param-cc="wave"></small></div>
    <h2 style="margin-top:10px">Filter</h2>
    <!-- A slider bound to a parameter, with its name, its value as text and its learned
         controller. Double-click resets it; right-click starts MIDI learn. -->
    <div class="row"><label for="cutoff" data-param-name="cutoff"></label><input id="cutoff" type="range" data-param="cutoff"><output data-param-text="cutoff"></output><small data-param-cc="cutoff"></small></div>
    <div class="row"><label for="resonance" data-param-name="resonance"></label><input id="resonance" type="range" data-param="resonance"><output data-param-text="resonance"></output><small data-param-cc="resonance"></small></div>
  </section>
  <section>
    <h2>Amp</h2>
    <div class="row"><label for="attack" data-param-name="attack"></label><input id="attack" type="range" data-param="attack"><output data-param-text="attack"></output><small data-param-cc="attack"></small></div>
    <div class="row"><label for="decay" data-param-name="decay"></label><input id="decay" type="range" data-param="decay"><output data-param-text="decay"></output><small data-param-cc="decay"></small></div>
    <div class="row"><label for="sustain" data-param-name="sustain"></label><input id="sustain" type="range" data-param="sustain"><output data-param-text="sustain"></output><small data-param-cc="sustain"></small></div>
    <div class="row"><label for="release" data-param-name="release"></label><input id="release" type="range" data-param="release"><output data-param-text="release"></output><small data-param-cc="release"></small></div>
  </section>
  <section>
    <h2>LFO to cutoff</h2>
    <div class="row"><label for="lfo_rate" data-param-name="lfo_rate"></label><input id="lfo_rate" type="range" data-param="lfo_rate"><output data-param-text="lfo_rate"></output><small data-param-cc="lfo_rate"></small></div>
    <div class="row"><label for="lfo_depth" data-param-name="lfo_depth"></label><input id="lfo_depth" type="range" data-param="lfo_depth"><output data-param-text="lfo_depth"></output><small data-param-cc="lfo_depth"></small></div>
  </section>
  <section>
    <h2>Output</h2>
    <div class="row"><label for="bend_range" data-param-name="bend_range"></label><input id="bend_range" type="range" data-param="bend_range"><output data-param-text="bend_range"></output><small data-param-cc="bend_range"></small></div>
    <div class="row"><label for="gain" data-param-name="gain"></label><input id="gain" type="range" data-param="gain"><output data-param-text="gain"></output><small data-param-cc="gain"></small></div>
  </section>
</main>
</body>
</html>
